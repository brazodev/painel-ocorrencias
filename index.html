<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro e Painel de Ocorrências</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1d1d1f;
      --muted: #86868b;
      --border: #e5e5ea;
      --blue: #3483FA;
      --red: #FF4545;
      --navy: #2D3277;
      --orange: #F58220;
      --green: #2e7d32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'IBM Plex Mono', monospace;
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.2rem; font-weight: 700; }
    #clock { font-size: 0.85rem; color: var(--muted); }

    .status-strip {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .stat-box { flex: 1; text-align: center; }
    .stat-num { font-size: 1.4rem; font-weight: 700; color: var(--blue); }
    .stat-label { font-size: 0.75rem; color: var(--muted); }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .form-container {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .card-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
    .card-icon svg { width: 24px; height: 24px; stroke: currentColor; }
    .cat-Candidatos { color: var(--red); }
    .cat-tec { color: var(--blue); }
    .cat-Comunicação { color: var(--navy); }
    .cat-Operacionais { color: var(--orange); }
    .card-num { font-size: 1.2rem; font-weight: 700; }
    .card-label { font-size: 0.75rem; color: var(--muted); }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: var(--muted); }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.85rem;
      background: var(--card-bg);
    }
    .sev-group { display: flex; gap: 8px; }
    .sev-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      text-align: center;
    }
    .sev-btn.selected { background: var(--text); color: white; border-color: var(--text); }

    button.btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .log-list { margin-top: 15px; }
    .log-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      display: flex;
      gap: 12px;
    }
    .log-tag svg { width: 20px; height: 20px; }
    .log-body { flex: 1; }
    .log-top { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; }
    .log-type { font-weight: 600; }
    .log-meta { font-size: 0.75rem; color: var(--muted); }
    .log-desc { font-size: 0.8rem; margin-bottom: 6px; }
    .log-foot { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); }
    .sev-pill {
      padding: 2px 6px;
      border-radius: 4px;
      background: #eee;
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .empty-state svg { width: 36px; height: 36px; margin-bottom: 8px; stroke: var(--muted); }
  </style>
</head>
<body>

  <header>
    <h1>Registro de Ocorrências</h1>
    <div id="clock">--/--/---- --:--</div>
  </header>

  <!-- FAIXA DE STATUS COM AS REGRAS SOLICITADAS -->
  <div class="status-strip">
    <div class="stat-box">
      <div class="stat-num" id="statHoje">0</div>
      <div class="stat-label">Hoje</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="statSemana">0</div>
      <div class="stat-label">Esta Semana (Seg - Dom)</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="stat30Dias">0</div>
      <div class="stat-label">Últimos 30 Dias</div>
    </div>
  </div>

  <div class="cards-grid" id="cardsRow"></div>

  <div class="main-grid">
    <!-- FORMULÁRIO DE REGISTRO -->
    <div class="form-container">
      <h3 style="font-size: 0.9rem; margin-bottom: 15px;">Nova Ocorrência</h3>
      <div class="form-group">
        <label>Categoria</label>
        <select id="fCategoria">
          <option value="Candidatos">Candidatos</option>
          <option value="Problemas técnicos">Problemas técnicos</option>
          <option value="Comunicação">Comunicação</option>
          <option value="Operacionais">Operacionais</option>
        </select>
      </div>

      <div class="form-group">
        <label>Tipo de Ocorrência</label>
        <select id="fTipo"></select>
      </div>

      <div class="form-group" id="fTipoOutroWrap" style="display: none;">
        <label>Especifique o Tipo</label>
        <input type="text" id="fTipoOutro" placeholder="Descreva o tipo de ocorrência">
      </div>

      <div class="form-group">
        <label>Data</label>
        <input type="date" id="fData">
      </div>

      <div class="form-group">
        <label>Responsável</label>
        <input type="text" id="fResponsavel" placeholder="Seu nome">
      </div>

      <div class="form-group">
        <label>Vaga / ID (Opcional)</label>
        <input type="text" id="fVaga" placeholder="Ex: Auxiliar de Logística">
      </div>

      <div class="form-group">
        <label>Descrição</label>
        <textarea id="fDescricao" rows="3" placeholder="Detalhes do ocorrido..."></textarea>
      </div>

      <div class="form-group">
        <label>Severidade</label>
        <div class="sev-group">
          <div class="sev-btn" data-sev="Baixo">Baixo</div>
          <div class="sev-btn selected" data-sev="Médio">Médio</div>
          <div class="sev-btn" data-sev="Alto">Alto</div>
          <div class="sev-btn" data-sev="Crítico">Crítico</div>
        </div>
      </div>

      <button id="btnSalvar" class="btn-primary">Registrar Ocorrência</button>
      <div id="formMsg" style="margin-top: 10px; font-size: 0.8rem; text-align: center;"></div>
    </div>

    <!-- HISTÓRICO DE OCORRÊNCIAS -->
    <div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h3 style="font-size: 0.9rem;">Histórico de Ocorrências</h3>
        <select id="filterCategoria" style="width: auto; padding: 5px 10px;">
          <option value="">Todas as Categorias</option>
          <option value="Candidatos">Candidatos</option>
          <option value="Problemas técnicos">Problemas técnicos</option>
          <option value="Comunicação">Comunicação</option>
          <option value="Operacionais">Operacionais</option>
        </select>
      </div>
      <div class="log-list" id="logList"></div>
    </div>
  </div>

  <script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzhXlRwCbWfd86e-VeVPoGTzH4zKSzAsu6fk-5B_mIPCn84h2aP7dUl_8_5RTKJRqci/exec";

  const TIPOS = {
    "Candidatos": [
      "Candidato convocado sem necessidade",
      "Candidato foi ao pátio tirar dúvida",
      "Desistência",
      "No-show",
      "Reclamação de candidato",
      "Outro"
    ],
    "Problemas técnicos": [
      "Queda de sistema",
      "Erro de validação de documentos",
      "Instabilidade de plataforma",
      "Outro"
    ],
    "Comunicação": [
      "Falha no envio de e-mail",
      "Mensagem não entregue",
      "Erro de contato com candidato",
      "Outro"
    ],
    "Operacionais": [
      "Exame realizado há menos de 30 dias reagendado indevidamente",
      "Atraso em etapa do processo",
      "Documentação pendente",
      "Erro de agendamento de entrevista",
      "Outro"
    ]
  };

  const ICONS = {
    "Candidatos": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
    "Problemas técnicos": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>',
    "Comunicação": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    "Operacionais": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/><path d="M9 12h6M9 16h6"/></svg>',
  };
  const EMPTY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>';

  const catKey = c => c === "Problemas técnicos" ? "tec" : c;

  let occurrences = [];

  function todayISO(){ return new Date().toISOString().slice(0,10); }

  // Retorna a data da Segunda-feira da semana atual em formato YYYY-MM-DD
  function getStartOfWeekISO() {
    const now = new Date();
    const day = now.getDay();
    const diff = now.getDate() - day + (day === 0 ? -6 : 1);
    const monday = new Date(now.setDate(diff));
    return monday.toISOString().slice(0, 10);
  }

  // Retorna a data de 30 dias atrás em formato YYYY-MM-DD
  function get30DaysAgoISO() {
    const d = new Date(Date.now() - 30 * 86400000);
    return d.toISOString().slice(0, 10);
  }

  function populateTipos(){
    const cat = document.getElementById('fCategoria').value;
    const sel = document.getElementById('fTipo');
    sel.innerHTML = TIPOS[cat].map(t => `<option value="${t}">${t}</option>`).join('');
    toggleOutro();
  }
  function toggleOutro(){
    const wrap = document.getElementById('fTipoOutroWrap');
    wrap.style.display = document.getElementById('fTipo').value === 'Outro' ? 'block' : 'none';
  }

  document.getElementById('fCategoria').addEventListener('change', populateTipos);
  document.getElementById('fTipo').addEventListener('change', toggleOutro);
  document.querySelectorAll('.sev-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.sev-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });

  function updateClock(){
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleString('pt-BR', {
      weekday:'short', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'
    });
  }
  updateClock();
  setInterval(updateClock, 1000*30);

  async function loadOccurrences(){
    try {
      const res = await fetch(API_URL + '?t=' + Date.now());
      const data = await res.json();
      occurrences = Array.isArray(data) ? data : [];
      occurrences.sort((a,b)=> (b.data + (b.criadoEm || '')).localeCompare(a.data + (a.criadoEm || '')));
    } catch(e) {
      console.error('Erro ao carregar ocorrências:', e);
      occurrences = [];
    }
  }

  async function saveOccurrence(occ){
    try {
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(occ)
      });
    } catch(e) {
      console.error('Erro ao salvar no Google Sheets:', e);
      throw e;
    }
  }

  document.getElementById('btnSalvar').addEventListener('click', async ()=>{
    const btn = document.getElementById('btnSalvar');
    const msg = document.getElementById('formMsg');
    const categoria = document.getElementById('fCategoria').value;
    let tipo = document.getElementById('fTipo').value;
    const tipoOutro = document.getElementById('fTipoOutro').value.trim();
    const data = document.getElementById('fData').value || todayISO();
    const responsavel = document.getElementById('fResponsavel').value.trim();
    const vaga = document.getElementById('fVaga').value.trim();
    const descricao = document.getElementById('fDescricao').value.trim();
    const sevBtn = document.querySelector('.sev-btn.selected');
    const severidade = sevBtn ? sevBtn.dataset.sev : 'Médio';

    if(tipo === 'Outro'){
      if(!tipoOutro){ msg.style.color='var(--red)'; msg.textContent='Especifique o tipo de ocorrência.'; return; }
      tipo = tipoOutro;
    }
    if(!responsavel){ msg.style.color='var(--red)'; msg.textContent='Informe o responsável pelo registro.'; return; }

    btn.disabled = true;
    msg.style.color='var(--muted)';
    msg.textContent = 'Salvando na nuvem…';

    const occ = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2,8),
      categoria, tipo, data, responsavel, vaga, descricao, severidade,
      criadoEm: new Date().toISOString()
    };

    try{
      await saveOccurrence(occ);
      await loadOccurrences();
      msg.style.color='var(--green)';
      msg.textContent = 'Ocorrência registrada com sucesso!';
      document.getElementById('fDescricao').value = '';
      document.getElementById('fVaga').value = '';
      document.getElementById('fResponsavel').value = '';
      document.getElementById('fData').value = todayISO();
      
      updateStatusStrip();
      renderCards();
      renderLog();
    }catch(e){
      msg.style.color='var(--red)';
      msg.textContent = 'Erro ao salvar. Tente novamente.';
      console.error(e);
    }finally{
      btn.disabled = false;
    }
  });

  // Atualização dos Contadores com as Regras
  function updateStatusStrip(){
    const today = todayISO();
    const startOfWeek = getStartOfWeekISO();
    const thirtyDaysAgo = get30DaysAgoISO();

    // Hoje
    document.getElementById('statHoje').textContent = occurrences.filter(o => o.data === today).length;
    
    // Esta semana (Segunda a Domingo -> Reseta na Segunda-feira)
    document.getElementById('statSemana').textContent = occurrences.filter(o => o.data >= startOfWeek).length;
    
    // Últimos 30 Dias
    document.getElementById('stat30Dias').textContent = occurrences.filter(o => o.data >= thirtyDaysAgo).length;
  }

  function renderCards(){
    const cats = ["Candidatos","Problemas técnicos","Comunicação","Operacionais"];
    const row = document.getElementById('cardsRow');
    row.innerHTML = cats.map(c=>{
      const count = occurrences.filter(o=>o.categoria===c).length;
      return `<div class="card cat-${catKey(c)}">
        <div class="card-icon">${ICONS[c]}</div>
        <div>
          <div class="card-num">${count}</div>
          <div class="card-label">${c}</div>
        </div>
      </div>`;
    }).join('');
  }

  function renderLog(){
    const filter = document.getElementById('filterCategoria').value;
    const list = document.getElementById('logList');
    const items = filter ? occurrences.filter(o=>o.categoria===filter) : occurrences;
    if(items.length === 0){
      list.innerHTML = `<div class="empty-state">${EMPTY_ICON}<div>Nenhuma ocorrência registrada ainda.</div></div>`;
      return;
    }
    list.innerHTML = items.map(o=>{
      const dataFmt = o.data ? o.data.split('-').reverse().join('/') : '—';
      return `<div class="log-item">
        <div class="log-tag cat-${catKey(o.categoria)}">${ICONS[o.categoria] || ''}</div>
        <div class="log-body">
          <div class="log-top">
            <span class="log-type">${escapeHtml(o.tipo || '')}</span>
            <span class="log-meta">${dataFmt} · ${escapeHtml(o.responsavel||'—')}</span>
          </div>
          ${o.vaga ? `<div class="log-meta" style="margin-bottom:3px;">${escapeHtml(o.vaga)}</div>` : ''}
          ${o.descricao ? `<div class="log-desc">${escapeHtml(o.descricao)}</div>` : ''}
          <div class="log-foot">
            <span class="sev-pill">${o.severidade}</span>
            <span>${o.categoria}</span>
          </div>
        </div>
      </div>`;
  }).join('');
  }

  function escapeHtml(str){
    if(!str) return '';
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  document.getElementById('filterCategoria').addEventListener('change', renderLog);

  // Inicialização
  document.getElementById('fData').value = todayISO();
  populateTipos();
  (async () => {
    await loadOccurrences();
    updateStatusStrip();
    renderCards();
    renderLog();
  })();
  </script>
</body>
</html>
