<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Ocorrências — Processo Seletivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    /* Paleta Mercado Livre */
    --ml-yellow: #FFE600;
    --ml-yellow-deep: #FFD100;
    --blue: #3483FA;
    --blue-dark: #2968C8;
    --navy: #2D3277;
    --green: #00A650;
    --amber: #F58220;
    --red: #FF4545;

    --bg: #EBEBEB;
    --surface: #FFFFFF;
    --surface-2: #F6F6F6;
    --line: #E4E4E4;
    --text: #2B2B2B;
    --muted: #666666;
    --muted-2: #999999;

    --mono: 'IBM Plex Mono', monospace;
    --disp: 'Poppins', sans-serif;
    --body: 'Inter', sans-serif;

    --radius: 12px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 16px rgba(43,43,43,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--body);}
  body{min-height:100vh;-webkit-font-smoothing:antialiased;}

  /* ---------- TELA DE LOGIN (CENTRALIZADA) ---------- */
  .login-screen{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: var(--bg);
  }
  .login-card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  .login-icon{
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, var(--ml-yellow) 0%, var(--ml-yellow-deep) 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    box-shadow: 0 4px 12px rgba(255,230,0,.4);
  }
  .login-icon svg{
    width: 28px;
    height: 28px;
    color: var(--navy);
  }
  .login-title{
    font-family: var(--disp);
    font-weight: 700;
    font-size: 20px;
    color: var(--navy);
    margin: 0 0 6px;
  }
  .login-subtitle{
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 28px;
    line-height: 1.5;
  }
  .login-btn-container{
    display: flex;
    justify-content: center;
    margin-bottom: 8px;
  }
  .login-alert{
    margin-top: 20px;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    text-align: left;
    line-height: 1.4;
  }
  .login-alert.error{
    background: rgba(255, 69, 69, 0.08);
    border: 1px solid var(--red);
    color: #c53030;
  }
  .login-alert.loading{
    background: rgba(52, 131, 250, 0.08);
    border: 1px solid var(--blue);
    color: var(--blue-dark);
  }

  /* ---------- BARRA DE USUARIO LOGADO ---------- */
  .user-bar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .user-bar-info{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
  }
  .user-bar-badge{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
  }
  .user-bar button{
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 12px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: .15s;
  }
  .user-bar button:hover{
    background: rgba(255,69,69,0.08);
    border-color: var(--red);
    color: var(--red);
  }

  /* ---------- CONTEUDO PRINCIPAL ---------- */
  .wrap{max-width:820px;margin:0 auto;padding:24px 20px 60px;}

  /* ---------- status strip ---------- */
  .status-strip{
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(100deg,var(--ml-yellow) 0%,var(--ml-yellow-deep) 100%);
    border-radius:var(--radius);
    padding:16px 22px;margin-bottom:20px;
    flex-wrap:wrap;gap:14px;
    box-shadow:var(--shadow);
  }
  .status-strip::after{
    content:"";position:absolute;right:-40px;top:-60%;width:220px;height:220%;
    background:rgba(255,255,255,.16);transform:rotate(18deg);pointer-events:none;
  }
  .status-left{display:flex;align-items:center;gap:12px;z-index:1;}
  .pulse-dot{position:relative;width:10px;height:10px;flex-shrink:0;}
  .pulse-dot::before,.pulse-dot::after{
    content:"";position:absolute;inset:0;border-radius:50%;background:var(--navy);
  }
  .pulse-dot::after{background:transparent;border:2px solid var(--navy);opacity:.5;
    animation:pulse 2.2s ease-out infinite;}
  @keyframes pulse{
    0%{transform:scale(1);opacity:.55;}
    100%{transform:scale(2.6);opacity:0;}
  }
  .status-title{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:-0.01em;color:var(--navy);}
  .status-sub{color:rgba(45,50,119,.65);font-size:12px;font-family:var(--mono);margin-top:2px;}
  .status-right{display:flex;gap:24px;align-items:baseline;z-index:1;}
  .stat{text-align:right;}
  .stat-num{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1;color:var(--navy);transition:opacity .2s;}
  .stat-num.loading{animation:statPulse 1s ease-in-out infinite;}
  @keyframes statPulse{
    0%,100%{opacity:1;}
    50%{opacity:.35;}
  }
  .stat-label{font-size:10px;color:rgba(45,50,119,.65);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;font-weight:600;}

  /* ---------- form panel ---------- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);}
  .panel-heading{font-family:var(--disp);font-weight:600;font-size:16px;margin:0 0 18px;color:var(--text);}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1/-1;}
  label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
  select, input[type=date], input[type=text], textarea{
    background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:10px 12px;font-family:var(--body);font-size:14px;
    outline:none;transition:.15s;
  }
  select:focus, input:focus, textarea:focus{
    border-color:var(--blue);background:var(--surface);
    box-shadow:0 0 0 3px rgba(52,131,250,.12);
  }
  textarea{resize:vertical;min-height:76px;font-family:var(--body);line-height:1.5;}

  .severity-row{display:flex;gap:8px;}
  .sev-btn{
    flex:1;padding:10px 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);
    color:var(--muted);font-family:var(--mono);font-size:12.5px;font-weight:500;cursor:pointer;text-align:center;
    transition:.15s;
  }
  .sev-btn:hover{border-color:var(--muted-2);}
  .sev-btn.selected[data-sev="Baixo"]{background:rgba(0,166,80,.1);border-color:var(--green);color:var(--green);font-weight:600;}
  .sev-btn.selected[data-sev="Médio"]{background:rgba(245,130,32,.1);border-color:var(--amber);color:var(--amber);font-weight:600;}
  .sev-btn.selected[data-sev="Alto"]{background:rgba(255,69,69,.1);border-color:var(--red);color:var(--red);font-weight:600;}

  .submit-btn{
    display:inline-flex;align-items:center;gap:8px;
    margin-top:20px;background:var(--blue);color:#fff;border:none;border-radius:9px;
    padding:12px 24px;font-family:var(--disp);font-weight:600;font-size:14px;cursor:pointer;
    transition:.15s;box-shadow:0 2px 8px rgba(52,131,250,.28);
  }
  .submit-btn:hover{background:var(--blue-dark);transform:translateY(-1px);box-shadow:0 4px 12px rgba(52,131,250,.32);}
  .submit-btn:active{transform:translateY(0);}
  .submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none;}
  .form-msg{margin-top:12px;font-size:13px;font-family:var(--mono);color:var(--green);min-height:16px;transition:.15s;}

  @media(max-width:820px){
    .form-grid{grid-template-columns:1fr;}
    .status-right{gap:16px;}
    .status-strip{padding:16px;}
  }
  @media(max-width:480px){
    .status-strip{flex-direction:column;align-items:flex-start;}
    .status-right{width:100%;justify-content:space-between;}
  }
</style>
</head>
<body>

<!-- TELA 1: LOGIN CENTRALIZADO (Padrão) -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <h1 class="login-title">Registro de Ocorrências</h1>
    <p class="login-subtitle">Processo Seletivo — Entre com uma conta Google autorizada para ter acesso ao sistema.</p>
    
    <div class="login-btn-container">
      <div id="g_id_onload"
           data-client_id="315923477453-9ij8ib9rkplr8dofdps5rohchjbm44mm.apps.googleusercontent.com"
           data-context="signin"
           data-ux_mode="popup"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-size="large"></div>
    </div>

    <div id="loginAlert" class="login-alert" style="display:none;"></div>
  </div>
</div>

<!-- TELA 2: FORMULÁRIO E DASHBOARD (Oculta até login autorizados) -->
<div id="appScreen" class="wrap" style="display:none;">

  <div class="user-bar">
    <div class="user-bar-info">
      <span class="user-bar-badge"></span>
      <span>Conectado como: <strong id="userEmailTag"></strong></span>
    </div>
    <button onclick="logoutGoogle()">Sair / Trocar conta</button>
  </div>

  <div class="status-strip">
    <div class="status-left">
      <div class="pulse-dot"></div>
      <div>
        <div class="status-title">Registro de Ocorrências — Processo Seletivo</div>
        <div class="status-sub" id="clock">carregando…</div>
      </div>
    </div>
    <div class="status-right">
      <div class="stat"><div class="stat-num" id="statHoje">–</div><div class="stat-label">Hoje</div></div>
      <div class="stat"><div class="stat-num" id="statSemana">–</div><div class="stat-label">Semana atual</div></div>
      <div class="stat"><div class="stat-num" id="statTotal">–</div><div class="stat-label">30 dias</div></div>
    </div>
  </div>

  <div class="panel">
    <h2 class="panel-heading">Nova ocorrência</h2>

    <div class="form-grid">
      <div class="field">
        <label>Categoria</label>
        <select id="fCategoria">
          <option value="Candidatos">Candidatos</option>
          <option value="Problemas técnicos">Problemas técnicos</option>
          <option value="Comunicação">Comunicação</option>
          <option value="Operacionais">Operacionais</option>
        </select>
      </div>
      <div class="field">
        <label>Tipo de ocorrência</label>
        <select id="fTipo"></select>
      </div>
      <div class="field" id="fTipoOutroWrap" style="display:none;">
        <label>Especifique o tipo</label>
        <input type="text" id="fTipoOutro" placeholder="Descreva o tipo de ocorrência">
      </div>
      <div class="field">
        <label>Data</label>
        <input type="date" id="fData">
      </div>
      <div class="field">
        <label>Responsável pelo registro</label>
        <input type="text" id="fResponsavel" placeholder="Nome de quem está registrando">
      </div>
      <div class="field">
        <label>Vaga / Unidade (opcional)</label>
        <input type="text" id="fVaga" placeholder="Ex: Analista de RH — Unidade Centro">
      </div>
      <div class="field">
        <label>Impacto</label>
        <div class="severity-row" id="fSeveridade">
          <div class="sev-btn" data-sev="Baixo">Baixo</div>
          <div class="sev-btn selected" data-sev="Médio">Médio</div>
          <div class="sev-btn" data-sev="Alto">Alto</div>
        </div>
      </div>
      <div class="field full">
        <label>Descrição do ocorrido</label>
        <textarea id="fDescricao" placeholder="Detalhe o que aconteceu e o impacto gerado no processo seletivo"></textarea>
      </div>
    </div>
    <button class="submit-btn" id="btnSalvar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      Registrar ocorrência
    </button>
    <div class="form-msg" id="formMsg"></div>
  </div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzhXlRwCbWfd86e-VeVPoGTzH4zKSzAsu6fk-5B_mIPCn84h2aP7dUl_8_5RTKJRqci/exec";

let googleToken = sessionStorage.getItem('g_token');

// Extrai o e-mail codificado no token do Google (JWT)
function parseJwt(token) {
  try {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(jsonPayload);
  } catch (e) {
    return null;
  }
}

function showLoginAlert(msg, type) {
  const alertBox = document.getElementById('loginAlert');
  alertBox.className = `login-alert ${type}`;
  alertBox.innerHTML = msg;
  alertBox.style.display = 'block';
}

function hideLoginAlert() {
  document.getElementById('loginAlert').style.display = 'none';
}

// Valida o e-mail no Apps Script antes de liberar a tela
async function validateAndLogin(token) {
  const payload = parseJwt(token);
  const email = payload ? payload.email : 'usuário';

  showLoginAlert(`⏳ Verificando permissões para <strong>${email}</strong>…`, 'loading');

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'checkAuth', token: token })
    });
    
    const json = await res.json();

    if (json.erro) {
      // E-mail não autorizado
      sessionStorage.removeItem('g_token');
      googleToken = null;
      showLoginAlert(`⚠️ <strong>Acesso Negado:</strong> O e-mail <strong>${email}</strong> não tem permissão para acessar este sistema. Entre com uma conta autorizada.`, 'error');
    } else {
      // Autorizado com sucesso
      sessionStorage.setItem('g_token', token);
      googleToken = token;
      hideLoginAlert();
      enterApp(email);
    }
  } catch (err) {
    console.error("Erro ao verificar autorização:", err);
    sessionStorage.setItem('g_token', token);
    googleToken = token;
    hideLoginAlert();
    enterApp(email);
  }
}

// Transição para a tela principal
function enterApp(email) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('userEmailTag').textContent = email;
  initApp();
}

function logoutGoogle() {
  sessionStorage.removeItem('g_token');
  googleToken = null;
  location.reload();
}

// Executado quando a pessoa faz login no popup do Google
function handleCredentialResponse(response) {
  if (response && response.credential) {
    validateAndLogin(response.credential);
  }
}

// Checagem automática caso já esteja logado na sessão
if (googleToken) {
  validateAndLogin(googleToken);
}

// --- LÓGICA DO FORMULÁRIO ---
const TIPOS = {
  "Candidatos": [
    "Candidato convocado sem necessidade",
    "Candidato foi ao pátio tirar dúvida",
    "Desistência",
    "No-show",
    "Reclamação de candidato",
    "Outro"
  ],
  "Problemas técnicos": [
    "Queda de sistema",
    "Erro de validação de documentos",
    "Instabilidade de plataforma",
    "Outro"
  ],
  "Comunicação": [
    "Falha no envio de e-mail",
    "Mensagem não entregue",
    "Erro de contato com candidato",
    "Outro"
  ],
  "Operacionais": [
    "Exame realizado há menos de 30 dias reagendado indevidamente",
    "Atraso em etapa do processo",
    "Documentação pendente",
    "Erro de agendamento de entrevista",
    "Outro"
  ]
};

let occurrences = [];

function todayISO(){ return new Date().toISOString().slice(0,10); }

function mondayOfWeekISO(date){
  const d = new Date(date);
  const day = d.getDay();
  const diffToMonday = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diffToMonday);
  return d.toISOString().slice(0,10);
}

function populateTipos(){
  const cat = document.getElementById('fCategoria').value;
  const sel = document.getElementById('fTipo');
  sel.innerHTML = TIPOS[cat].map(t => `<option value="${t}">${t}</option>`).join('');
  toggleOutro();
}
function toggleOutro(){
  const wrap = document.getElementById('fTipoOutroWrap');
  wrap.style.display = document.getElementById('fTipo').value === 'Outro' ? 'flex' : 'none';
}

document.getElementById('fCategoria').addEventListener('change', populateTipos);
document.getElementById('fTipo').addEventListener('change', toggleOutro);
document.querySelectorAll('.sev-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.sev-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
  });
});

function updateClock(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleString('pt-BR', {
    weekday:'short', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'
  });
}
updateClock();
setInterval(updateClock, 1000*30);

function setStatsLoading(isLoading){
  ['statHoje','statSemana','statTotal'].forEach(id=>{
    document.getElementById(id).classList.toggle('loading', isLoading);
  });
}

function normalizeDate(raw){
  if(!raw) return '';
  const s = String(raw).trim();

  const isoMatch = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(isoMatch) return `${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}`;

  const brMatch = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if(brMatch) return `${brMatch[3]}-${brMatch[2]}-${brMatch[1]}`;

  const d = new Date(s);
  if(!isNaN(d.getTime())) return d.toISOString().slice(0,10);

  return s;
}

async function loadOccurrences(){
  try {
    const res = await fetch(API_URL + '?t=' + Date.now(), { cache: 'no-store' });
    const raw = await res.text();

    let parsed;
    try{
      parsed = JSON.parse(raw);
    }catch(parseErr){
      console.error('Resposta da planilha não é JSON válido:', raw);
      return;
    }

    let list = null;
    if(Array.isArray(parsed)) list = parsed;
    else if(parsed && Array.isArray(parsed.data)) list = parsed.data;
    else if(parsed && Array.isArray(parsed.rows)) list = parsed.rows;
    else if(parsed && Array.isArray(parsed.result)) list = parsed.result;

    if(list === null){
      console.error('Formato de resposta inesperado da planilha:', parsed);
      return;
    }

    list.forEach(o => { o.data = normalizeDate(o.data); });
    list.sort((a,b)=> ((b.data||'') + (b.criadoEm || '')).localeCompare((a.data||'') + (a.criadoEm || '')));
    occurrences = list;
  } catch(e) {
    console.error('Erro ao carregar ocorrências:', e);
  }
}

async function saveOccurrence(occ){
  occ.token = googleToken;
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(occ)
  });
  const json = await res.json();
  if (json.erro) throw new Error(json.erro);
}

document.getElementById('btnSalvar').addEventListener('click', async ()=>{
  const btn = document.getElementById('btnSalvar');
  const msg = document.getElementById('formMsg');

  if (!googleToken) {
    msg.style.color = 'var(--red)';
    msg.textContent = 'Por favor, faça login primeiro.';
    return;
  }

  const categoria = document.getElementById('fCategoria').value;
  let tipo = document.getElementById('fTipo').value;
  const tipoOutro = document.getElementById('fTipoOutro').value.trim();
  const data = document.getElementById('fData').value || todayISO();
  const responsavel = document.getElementById('fResponsavel').value.trim();
  const vaga = document.getElementById('fVaga').value.trim();
  const descricao = document.getElementById('fDescricao').value.trim();
  const sevBtn = document.querySelector('.sev-btn.selected');
  const severidade = sevBtn ? sevBtn.dataset.sev : 'Médio';

  if(tipo === 'Outro'){
    if(!tipoOutro){ msg.style.color='var(--red)'; msg.textContent='Especifique o tipo de ocorrência.'; return; }
    tipo = tipoOutro;
  }
  if(!responsavel){ msg.style.color='var(--red)'; msg.textContent='Informe o responsável pelo registro.'; return; }

  btn.disabled = true;
  msg.style.color='var(--muted)';
  msg.textContent = 'Salvando na nuvem…';

  const occ = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2,8),
    categoria, tipo, data, responsavel, vaga, descricao, severidade,
    criadoEm: new Date().toISOString()
  };

  try{
    await saveOccurrence(occ);

    occurrences.push(occ);
    updateStatusStrip();

    msg.style.color='var(--green)';
    msg.textContent = 'Ocorrência registrada com sucesso!';
    document.getElementById('fDescricao').value = '';
    document.getElementById('fVaga').value = '';
    document.getElementById('fResponsavel').value = '';
    document.getElementById('fData').value = todayISO();

    setStatsLoading(true);
    await loadOccurrences();
    updateStatusStrip();
    setStatsLoading(false);
  }catch(e){
    msg.style.color='var(--red)';
    msg.textContent = e.message || 'Erro ao salvar. Tente novamente!';
    console.error(e);
  }finally{
    btn.disabled = false;
  }
});

function updateStatusStrip(){
  const today = todayISO();
  const monday = mondayOfWeekISO(new Date());
  const cutoff30 = new Date(Date.now() - 30*86400000).toISOString().slice(0,10);

  document.getElementById('statHoje').textContent = occurrences.filter(o=>o.data===today).length;
  document.getElementById('statSemana').textContent = occurrences.filter(o=>o.data>=monday && o.data<=today).length;
  document.getElementById('statTotal').textContent = occurrences.filter(o=>o.data>=cutoff30 && o.data<=today).length;
}

let appInitialized = false;
function initApp(){
  if(appInitialized) return;
  appInitialized = true;
  document.getElementById('fData').value = todayISO();
  populateTipos();
  (async () => {
    await loadOccurrences();
    updateStatusStrip();
    setInterval(async () => {
      setStatsLoading(true);
      await loadOccurrences();
      updateStatusStrip();
      setStatsLoading(false);
    }, 30000);
  })();
}
</script>
</body>
